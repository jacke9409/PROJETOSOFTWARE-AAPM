<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPM — Painel Administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="dashboard-body">

    <div class="fundo-fixo">
        <div class="sky"></div>
        <div class="camada-nuvens"></div>
    </div>

    <div class="painel-admin-wrapper">

        <!-- HEADER -->
        <header class="dashboard-header-admin">
            <div class="header-titulos">
                <div class="header-logo-grupo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-logo-icon"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span class="header-marca">AAPM</span>
                    <span class="header-separador">/</span>
                    <span class="header-secao">Administrativo</span>
                </div>
                <p class="header-subtitulo">SENAI Brás — Controle Interno</p>
            </div>
            <div class="header-usuario">
                <div class="avatar-admin">AD</div>
                <div class="header-usuario-info">
                    <span class="header-usuario-nome">Administrador</span>
                    <span class="header-usuario-status">Online ●</span>
                </div>
            </div>
        </header>

        <div class="dashboard-corpo-admin">

            <!-- SIDEBAR -->
            <aside class="dashboard-sidebar-admin">
                <nav>
                    <p class="sidebar-label-admin">Navegação</p>
                    <ul class="sidebar-menu-admin">
                        <li>
    <a href="/dashboard/visaogeral" id="menu-inicio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Visão Geral
    </a>
</li>
                        <li>
                            <a href="/dashboard/produtos" id="menu-produtos">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                                Produtos
                            </a>
                        </li>
                        <li>
                            <a href="/dashboard/categorias" id="menu-categorias">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                                Categorias
                            </a>
                        </li>
                        <li>
                            <a href="/dashboard/fornecedores" id="menu-fornecedores">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                                Fornecedores
                            </a>
                        </li>
                        <li>
                            <a href="/dashboard/vendas" id="menu-vendas">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                                Vendas
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="sidebar-footer-admin">
                    <a href="/" id="btn-sair-admin" class="btn-sair-admin">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sair do Painel
                    </a>
                </div>
            </aside>

            <!-- CONTEÚDO PRINCIPAL -->
            <main class="admin-conteudo-principal custom-scroll">
                {% block admin_content %}{% endblock %}
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const path = window.location.pathname;
            const mapa = {
                "/dashboard/produtos":     "menu-produtos",
                "/dashboard/categorias":   "menu-categorias",
                "/dashboard/fornecedores": "menu-fornecedores",
                "/dashboard/vendas":       "menu-vendas",
            };
            const ativo = mapa[path] || "menu-inicio";
            document.getElementById(ativo)?.classList.add("active");
        });
    </script>
    <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>
</html>
