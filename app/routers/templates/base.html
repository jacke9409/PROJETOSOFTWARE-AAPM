<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPM - Navegação Vertical 360</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>

    <div class="universo-vertical" id="universoScroll">

        <section class="painel-vertical" id="painel-login">
            <div class="wrapper-login">
                <h2 class="titulo-admin">ACESSO RESTRITO ADMINISTRATIVO</h2>
                <div class="card-glass">
                    <h3>Login</h3>
                    <form>
                        <div class="input-grupo">
                            <input type="email" placeholder="E-mail" required>
                        </div>
                        <div class="input-grupo">
                            <input type="password" placeholder="Senha" required>
                        </div>
                        <button type="submit" class="btn-entrar">Entrar</button>
                    </form>
                </div>
            </div>
            <div class="seta-indicadora seta-baixo" onclick="moverParaPainel(1)">
                <span>&#10225;</span> Voltar ao Início
            </div>
        </section>

        <section class="painel-vertical" id="painel-centro">
            <div class="seta-indicadora seta-topo" onclick="moverParaPainel(0)">
                <span>&#9650;</span> Acesso Restrito
            </div>

            <div class="conteudo-marca">
                <div class="logo-aapm-vetorial">AAPM</div>
                <p class="subtexto-marca">SENAI BRÁS</p>
            </div>

            <div class="seta-indicadora seta-rodape" onclick="moverParaPainel(2)">
                Site Oficial <span>&#9660;</span>
            </div>
        </section>

        <section class="painel-vertical" id="painel-publico">
            <div class="seta-indicadora seta-cima" onclick="moverParaPainel(1)">
                <span>&#10224;</span> Voltar ao Início
            </div>
            
            <div class="conteudo-publico">
                <h2 class="titulo-publico">SITE OFICIAL DA AAPM</h2>
                <p class="desc-publico">Descubra nossos produtos com praticidade e rapidez. Compre e agende serviços aqui.</p>
                <div class="vitrine-fake-placeholder">
                    <span>Área do Aluno & Produtos</span>
                </div>
            </div>
        </section>

    </div>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>
</html>
